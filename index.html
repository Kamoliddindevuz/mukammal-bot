<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Web App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, #0f0c1b, #24243e, #302b63);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            padding: 20px;
        }

        .app-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 25px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .profile-section {
            margin-bottom: 15px;
        }

        h1 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .status-badge {
            display: inline-block;
            background: rgba(0, 242, 254, 0.15);
            color: #00f2fe;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
        }

        .balance-card {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 16px;
            padding: 12px;
            margin: 15px 0;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .balance-title {
            font-size: 11px;
            color: #aaa;
            text-transform: uppercase;
        }

        .balance-value {
            font-size: 32px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
            margin-top: 5px;
        }

        /* Klik qilish uchun asosiy doira (Tanga) */
        .click-area {
            width: 160px;
            height: 160px;
            background: radial-gradient(circle, #ff007f, #7928ca);
            border-radius: 50%;
            margin: 25px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 70px;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.5);
            transition: transform 0.1s ease;
            position: relative;
        }

        .click-area:active {
            transform: scale(0.92);
        }

        .btn-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }

        .neon-btn {
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.2);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="profile-section">
            <h1 id="username">Foydalanuvchi</h1>
            <span class="status-badge">Koin Mayner</span>
        </div>

        <div class="balance-card">
            <div class="balance-title">Yig'ilgan Tangalar</div>
            <div id="balance" class="balance-value">0 🪙</div>
        </div>

        <!-- Bosganda tanga beradigan joy -->
        <div class="click-area" id="coinBtn">🚀</div>

        <div class="btn-grid">
            <button class="neon-btn" onclick="saveAndClose()">Hamyonga o'tkazish & Yopish</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Mahalliy xotiradan (LocalStore) tangalarni yuklash
        let coins = parseInt(localStorage.getItem('user_coins')) || 0;
        document.getElementById('balance').innerText = coins.toLocaleString() + " 🪙";

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('username').innerText = tg.initDataUnsafe.user.first_name;
        }

        // Tanga bosilganda ishlaydigan funksiya
        const coinBtn = document.getElementById('coinBtn');
        coinBtn.addEventListener('click', (e) => {
            coins += 1; // Har bosganda 1 tadan tanga qo'shadi
            document.getElementById('balance').innerText = coins.toLocaleString() + " 🪙";
            localStorage.setItem('user_coins', coins); // Telefon xotirasiga saqlaydi
            
            // Vibratsiya effektini berish (Telegram funksiyasi)
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
        });

        // Ma'lumotni botga yuborib yopish
        function saveAndClose() {
            tg.sendData("💰 Balans yangilandi: " + coins + " tanga");
            tg.close();
        }
    </script>
</body>
</html>
